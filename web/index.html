<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warlords II</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M2 1h12v7c0 4-3 6-6 7-3-1-6-3-6-7z' fill='%23c00' stroke='%23fc0'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    height: 100%;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
  }
  #canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    outline: none;
  }
  #status {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: #f7d08a;
    font: 16px "Cinzel", "Palatino", serif;
    letter-spacing: 1px;
    z-index: 10;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    transition: opacity 0.4s ease;
  }
  #progress-bar {
    width: 240px;
    height: 6px;
    background: #222;
    border: 1px solid #555;
    margin: 12px auto 0;
    border-radius: 3px;
    overflow: hidden;
    display: none;
  }
  #progress-fill {
    width: 0%;
    height: 100%;
    background: #d4a34b;
    transition: width 0.2s ease;
  }
  #error {
    display: none;
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: 16px;
    max-height: 40%;
    overflow: auto;
    background: #400;
    color: #fdd;
    font: 12px monospace;
    padding: 10px;
    border: 1px solid #900;
    border-radius: 4px;
    white-space: pre-wrap;
    z-index: 20;
  }
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<div id="status">
  <div id="status-text">Loading Warlords II&hellip;</div>
  <div id="progress-bar"><div id="progress-fill"></div></div>
</div>
<div id="error"></div>

<script>
  // Forward URL parameters (?scenario=ISLADIA&seed=123 etc.) into C++ CLI arguments.
  const params = new URLSearchParams(window.location.search);
  const args = [];
  if (params.has('scenario')) args.push('--scenario=' + params.get('scenario'));
  if (params.has('seed')) args.push('--seed=' + params.get('seed'));
  if (params.has('script')) args.push('--script=' + params.get('script'));
  if (params.has('size')) args.push('--size=' + params.get('size'));
  if (params.has('window')) args.push('--window');
  if (params.has('classic_ai')) args.push('--classic_ai');
  if (params.has('modern_ai')) args.push('--modern_ai');
  if (params.has('spectate')) args.push('--spectate');
  if (params.has('diplomacy')) args.push('--diplomacy');
  if (params.has('hidden_map')) args.push('--hidden_map');

  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('status-text');
  const progressBar = document.getElementById('progress-bar');
  const progressFill = document.getElementById('progress-fill');
  const errorEl = document.getElementById('error');

  window.addEventListener('error', (e) => {
    errorEl.style.display = 'block';
    errorEl.textContent += (e.message || e) + '\n';
  });

  var Module = {
    arguments: args,
    canvas: document.getElementById('canvas'),
    setStatus: function(text) {
      if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
      if (text === Module.setStatus.last.text) return;
      const m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
      if (m) {
        text = m[1];
        progressBar.style.display = 'block';
        progressFill.style.width = (parseFloat(m[2]) / parseFloat(m[4]) * 100) + '%';
      } else {
        progressBar.style.display = 'none';
      }
      statusText.textContent = text;
      if (!text) {
        statusEl.style.opacity = '0';
        setTimeout(() => { statusEl.style.display = 'none'; }, 400);
      }
    },
    preRun: [function() {
      // Set up persistent IndexedDB storage for preferences and save games under /libsdl.
      try {
        if (typeof FS !== 'undefined' && typeof IDBFS !== 'undefined') {
          FS.mkdir('/libsdl');
          FS.mount(IDBFS, {}, '/libsdl');
          FS.syncfs(true, function(err) {
            if (err) console.warn('IDBFS mount sync failed:', err);
          });
        }
      } catch (e) {
        console.warn('IDBFS initialization error:', e);
      }
    }],
    postRun: [function() {
      // Periodically sync saved games back to IndexedDB.
      setInterval(function() {
        try {
          if (typeof FS !== 'undefined' && typeof IDBFS !== 'undefined') {
            FS.syncfs(false, function() {});
          }
        } catch (e) {}
      }, 5000);
    }],
    totalDependencies: 0,
    monitorRunDependencies: function(left) {
      this.totalDependencies = Math.max(this.totalDependencies, left);
      Module.setStatus(left ? 'Preparing assets (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')...' : '');
    }
  };
</script>
<script async src="warlords2.js"></script>
</body>
</html>

# Publish the WebAssembly build of Warlords II to GitHub Pages on every push to main.
# C++ is the single source of truth; tools/build_web.sh compiles it to wasm.

name: Pages

on:
  push:
    branches: [main]
    paths: ["cpp/**", "original/**", "web/**", "tools/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than cancelling a deploy halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ hashFiles('MODULE.bazel.lock') }}
      - name: Build WebAssembly distribution
        run: ./tools/build_web.sh --out build/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
